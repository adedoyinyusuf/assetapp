version: '3.8'

services:
  # Main application with Stock Verification module
  assetapp:
    build:
      context: .
      dockerfile: docker/stock-verification.Dockerfile
    container_name: assetapp-stock-verification
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - REDIS_URL=redis://redis:6379
      # Stock Verification specific
      - STOCK_VERIFICATION_PHOTO_UPLOAD=true
      - STOCK_VERIFICATION_AUTO_ASSIGNMENT=true
      - STOCK_VERIFICATION_ADVANCED_REPORTING=true
      - STOCK_VERIFICATION_REAL_TIME_NOTIFICATIONS=true
      - STOCK_VERIFICATION_CACHING_ENABLED=true
      - STOCK_VERIFICATION_NOTIFICATIONS_ENABLED=true
      - STOCK_VERIFICATION_RATE_LIMITING_ENABLED=true
      - STOCK_VERIFICATION_AUDIT_ENABLED=true
      # Storage
      - STOCK_VERIFICATION_STORAGE_PROVIDER=${STOCK_VERIFICATION_STORAGE_PROVIDER:-local}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Notifications
      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET}
      - PUSHER_CLUSTER=${PUSHER_CLUSTER:-us-east-1}
      # SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock-verification-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: assetapp-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-assetapp}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-assetapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-verification-network

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    container_name: assetapp-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-verification-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: assetapp-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./public/uploads:/var/www/uploads:ro
    depends_on:
      - assetapp
    restart: unless-stopped
    networks:
      - stock-verification-network

  # Background job processor for notifications and analytics
  worker:
    build:
      context: .
      dockerfile: docker/stock-verification.Dockerfile
    container_name: assetapp-worker
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - WORKER_MODE=true
      # Stock Verification worker settings
      - STOCK_VERIFICATION_WORKER_CONCURRENCY=${STOCK_VERIFICATION_WORKER_CONCURRENCY:-5}
      - STOCK_VERIFICATION_NOTIFICATION_BATCH_SIZE=50
      - STOCK_VERIFICATION_ANALYTICS_BATCH_SIZE=100
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: ["node", "scripts/workers/stock-verification-worker.js"]
    networks:
      - stock-verification-network

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: assetapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - stock-verification-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: assetapp-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - stock-verification-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  stock-verification-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16